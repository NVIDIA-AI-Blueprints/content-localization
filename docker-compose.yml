# Trust boundary: gRPC hops between these services are plaintext within the
# compose network by default; enable the controller/client TLS flags for
# deployments whose service-to-service traffic crosses untrusted networks.
services:
  # Speech-to-Speech service
  speech-to-speech:
    container_name: s2s
    build:
      context: .
      dockerfile: dockerfiles/s2s.dockerfile
    image: speech-to-speech:0.1
    tty: true
    stdin_open: true
    # Add any necessary environment variables here
    environment:
      # gRPC utils parameters.
      - AI4M_LOG_LEVEL=${S2S_LOG_LEVEL}
      - S2S_GRPC_CONCURRENCY_MODE=${S2S_GRPC_CONCURRENCY_MODE}
      - S2S_GRPC_THREADS_PER_PROCESS=${S2S_GRPC_THREADS_PER_PROCESS}

      # S2S service parameters.
      - S2S_SERVICE=${S2S_SERVICE}
      - S2S_GRPC_API_PORT=${S2S_GRPC_API_PORT}
      - S2S_SERVER=speech-to-speech:${S2S_GRPC_API_PORT}
      - S2S_MAX_CONCURRENCY=${S2S_MAX_CONCURRENCY}
      - S2S_DEFAULT_SOURCE_LANGUAGE=${S2S_DEFAULT_SOURCE_LANGUAGE}
      - S2S_DEFAULT_TARGET_LANGUAGE=${S2S_DEFAULT_TARGET_LANGUAGE}
      - S2S_SAMPLE_RATE_HZ=${S2S_SAMPLE_RATE_HZ}
      - S2S_MESSAGE_SIZE=${S2S_MESSAGE_SIZE}

      # Third-party API keys — set whichever backend you use in .env
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CAMB_API_KEY=${CAMB_API_KEY:-}

      # Timeout and polling configuration
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-5.0}
      - BUFFER_POLL_TIMEOUT=${BUFFER_POLL_TIMEOUT:-0.1}
      - S2S_EL_DUBBING_POLL_INTERVAL=${S2S_EL_DUBBING_POLL_INTERVAL:-10}
      - S2S_EL_DUBBING_MAX_ATTEMPTS=${S2S_EL_DUBBING_MAX_ATTEMPTS:-120}
      - S2S_EL_KEEPALIVE_INTERVAL=${S2S_EL_KEEPALIVE_INTERVAL:-1}
      - S2S_CAMB_DUBBING_POLL_INTERVAL=${S2S_CAMB_DUBBING_POLL_INTERVAL:-10}
      - S2S_CAMB_DUBBING_MAX_ATTEMPTS=${S2S_CAMB_DUBBING_MAX_ATTEMPTS:-120}
      - S2S_CAMB_KEEPALIVE_INTERVAL=${S2S_CAMB_KEEPALIVE_INTERVAL:-1}
      - S2S_CAMB_ALT_FORMAT_POLL_INTERVAL=${S2S_CAMB_ALT_FORMAT_POLL_INTERVAL:-10}
      - S2S_CAMB_ALT_FORMAT_MAX_ATTEMPTS=${S2S_CAMB_ALT_FORMAT_MAX_ATTEMPTS:-120}

    # Add any necessary ports here
    ports:
      - ${S2S_GRPC_API_PORT}:${S2S_GRPC_API_PORT}
    # CPU-only service: the third-party dubbing backends run remotely, so no
    # GPU reservation or oversized shared memory is needed here.
    volumes:
      - ./volumes/tmp/s2s:/tmp:rw
    networks:
      - content-localization-network
    healthcheck:
      test: [ "CMD", "grpcurl", "--plaintext", "--import-path", "/opt/s2s/protos", "--proto", "/opt/s2s/protos/health.proto", "speech-to-speech:${S2S_GRPC_API_PORT}", "grpc.health.v1.Health/Check" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - default
      - third-party-s2s
      - lipsync
      - third-party-s2s-lipsync
      - third-party-s2s-asd-lipsync
      - controller-third-party-s2s
      - demo-app-third-party-s2s

  # LIPSYNC service
  lipsync:
    container_name: lipsync
    # NOTE: the default LIPSYNC_IMAGE/ASD_IMAGE pins in configs/*.env point at
    # NVIDIA-internal staging registries (nvcr.io/nvstaging). External users
    # must override the *_IMAGE variables with published NIM images.
    image: ${LIPSYNC_IMAGE}
    runtime: nvidia
    shm_size: 4GB
    ports:
      - ${LIPSYNC_NIM_HTTP_API_PORT}:${LIPSYNC_NIM_HTTP_API_PORT}
      - ${LIPSYNC_NIM_GRPC_API_PORT}:${LIPSYNC_NIM_GRPC_API_PORT}
    environment:
      - NGC_API_KEY=${LIPSYNC_API_KEY}
      - NIM_HTTP_API_PORT=${LIPSYNC_NIM_HTTP_API_PORT}
      - NIM_GRPC_API_PORT=${LIPSYNC_NIM_GRPC_API_PORT}
      - NIM_TAGS_SELECTOR=${LIPSYNC_NIM_TAGS_SELECTOR}
      - AI4M_LOG_LEVEL=${LIPSYNC_LOG_LEVEL}
      - LIPSYNC_DEBUG_MODE=${LIPSYNC_DEBUG_MODE}
      - NV_AI4M_LS_INPUT_QUEUE_TIMEOUT_S=${NV_AI4M_LS_INPUT_QUEUE_TIMEOUT_S:-5}
      - NIM_LOG_LEVEL=${LIPSYNC_LOG_LEVEL}
      - LOG_LEVEL=${LIPSYNC_LOG_LEVEL}
    volumes:
      - ${LIPSYNC_MODEL_MOUNT_PATH}:/opt/nim/.cache:rw
    networks:
      - content-localization-network
    healthcheck:
      test: [ "CMD", "curl", "-v", "http://lipsync:${LIPSYNC_NIM_HTTP_API_PORT}/v1/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - default
      - lipsync
      - third-party-s2s-lipsync
      - third-party-s2s-asd-lipsync
      - asd-lipsync
      - controller-third-party-s2s
      - demo-app-third-party-s2s

  # Active Speaker Detection NIM
  asd:
    container_name: asd
    # NOTE: the default ASD_IMAGE pin points at an NVIDIA-internal staging
    # registry (nvcr.io/nvstaging); external users must override it.
    image: ${ASD_IMAGE}
    runtime: nvidia
    shm_size: 4GB
    ports:
      - ${ASD_NIM_HTTP_API_PORT}:${ASD_NIM_HTTP_API_PORT}
      - ${ASD_GRPC_API_PORT}:${ASD_GRPC_API_PORT}
    environment:
      - NGC_API_KEY=${ASD_API_KEY}
      - NIM_HTTP_API_PORT=${ASD_NIM_HTTP_API_PORT}
      - NIM_GRPC_API_PORT=${ASD_GRPC_API_PORT}
      - AI4M_LOG_LEVEL=${ASD_LOG_LEVEL}
      - NIM_LOG_LEVEL=${ASD_LOG_LEVEL}
      - LOG_LEVEL=${ASD_LOG_LEVEL}
      - MAXINE_MAX_CONCURRENCY_PER_GPU=1 # Required until ASD NIM supports concurrent requests
      - ASD_DIARIZATION_TOLERANCE_MS=${ASD_DIARIZATION_TOLERANCE_MS}

    volumes:
      - ${ASD_MODEL_MOUNT_PATH}:/opt/nim/.cache:rw
    networks:
      - content-localization-network
    healthcheck:
      test: [ "CMD", "curl", "-v", "http://asd:${ASD_NIM_HTTP_API_PORT}/v1/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    profiles:
      - default
      - asd
      - third-party-s2s-asd-lipsync
      - asd-lipsync
      - controller-third-party-s2s
      - demo-app-third-party-s2s

  # Controller service
  controller:
    container_name: controller
    build:
      context: .
      dockerfile: dockerfiles/controller.dockerfile
    image: controller:0.1
    tty: true
    stdin_open: true
    # Add any necessary environment variables here
    environment:
      # gRPC utils parameters.
      - AI4M_LOG_LEVEL=${CONTROLLER_LOG_LEVEL}
      - CONTROLLER_GRPC_CONCURRENCY_MODE=${CONTROLLER_GRPC_CONCURRENCY_MODE}
      - CONTROLLER_GRPC_THREADS_PER_PROCESS=${CONTROLLER_GRPC_THREADS_PER_PROCESS}
      - CONTROLLER_GRPC_API_PORT=${CONTROLLER_GRPC_API_PORT}
      - CONTROLLER_MAX_CONCURRENCY=${CONTROLLER_MAX_CONCURRENCY}
      - CONTROLLER_SERVER=controller:${CONTROLLER_GRPC_API_PORT}

      # Service endpoints
      - S2S_SERVER=speech-to-speech:${S2S_GRPC_API_PORT}
      - ASD_SERVER=asd:${ASD_GRPC_API_PORT}
      - LIPSYNC_SERVER=lipsync:${LIPSYNC_NIM_GRPC_API_PORT}

      # S2S Service Configuration
      - S2S_SERVICE=${S2S_SERVICE}

      # Timeout and polling configuration
      - HEALTH_CHECK_TIMEOUT=${HEALTH_CHECK_TIMEOUT:-5.0}
      - BUFFER_POLL_TIMEOUT=${BUFFER_POLL_TIMEOUT:-0.1}
      - CONTROLLER_CONFIG_POLL_TIMEOUT=${CONTROLLER_CONFIG_POLL_TIMEOUT:-5.0}
      - CONTROLLER_CLEANUP_TIMEOUT=${CONTROLLER_CLEANUP_TIMEOUT:-10.0}

      # Optional: Debug port for VS Code
      - CONTROLLER_DEBUG_PORT=${CONTROLLER_DEBUG_PORT}
      - CONTROLLER_VS_CODE_DEBUG=${CONTROLLER_VS_CODE_DEBUG}

      # Optional TLS for controller -> NIM channels (plaintext by default,
      # see docs/source/configuration.rst)
      - CONTROLLER_NIM_SSL_MODE=${CONTROLLER_NIM_SSL_MODE:-DISABLED}
      - CONTROLLER_NIM_SSL_KEY=${CONTROLLER_NIM_SSL_KEY:-}
      - CONTROLLER_NIM_SSL_CERT=${CONTROLLER_NIM_SSL_CERT:-}
      - CONTROLLER_NIM_SSL_ROOT_CERT=${CONTROLLER_NIM_SSL_ROOT_CERT:-}
      # Per-hop overrides of CONTROLLER_NIM_SSL_MODE; empty inherits the
      # global mode. Keep a hop DISABLED when its server runs plaintext
      # (the in-repo S2S serves TLS only when started with --use-ssl; the
      # NIM images expose no TLS surface).
      - CONTROLLER_S2S_SSL_MODE=${CONTROLLER_S2S_SSL_MODE:-}
      - CONTROLLER_ASD_SSL_MODE=${CONTROLLER_ASD_SSL_MODE:-}
      - CONTROLLER_LIPSYNC_SSL_MODE=${CONTROLLER_LIPSYNC_SSL_MODE:-}

    # Add any necessary ports here
    # The debugpy port is only published by the opt-in override file
    # docker-compose.debug.yml (add `-f docker-compose.debug.yml` when
    # debugging with CONTROLLER_VS_CODE_DEBUG=1).
    ports:
      - ${CONTROLLER_GRPC_API_PORT}:${CONTROLLER_GRPC_API_PORT}
    # CPU-only service: orchestration happens on the CPU; GPU work is done by
    # the LipSync/ASD NIMs.
    volumes:
      - ./volumes/tmp/controller:/tmp:rw
    networks:
      - content-localization-network
    depends_on:
      speech-to-speech:
        condition: service_healthy
        required: false
      asd:
        condition: service_healthy
        required: false
      lipsync:
        condition: service_healthy
        required: true
    healthcheck:
      test: [ "CMD", "grpcurl", "--plaintext", "--import-path", "/opt/controller/protos", "--proto", "/opt/controller/protos/health.proto", "controller:${CONTROLLER_GRPC_API_PORT}", "grpc.health.v1.Health/Check" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    profiles:
      - default
      - controller-third-party-s2s
      - asd-lipsync
      - demo-app-third-party-s2s

  demo-app:
    container_name: demo-app
    build:
      context: .
      dockerfile: ./client/demos/Dockerfile
      args:
        NEXT_PUBLIC_INPUT_FILE_NAME: "${DEFAULT_INPUT_FILE_NAME}"

    # Set environment variables directly in the compose file
    environment:
      - ENV_VARIABLE=production
      - NEXT_PUBLIC_ENV_VARIABLE=production
      - CONTROLLER_SERVER=controller:${CONTROLLER_GRPC_API_PORT}
      - DEFAULT_SOURCE_LANGUAGE=${S2S_DEFAULT_SOURCE_LANGUAGE}
      - DEFAULT_TARGET_LANGUAGE=${S2S_DEFAULT_TARGET_LANGUAGE}
      - OUTPUT_DIR=/demo-app
      - INPUT_DIR=/demo-app-assets
      - NEXT_PUBLIC_LOG_LEVEL=${REFERENCE_APP_LOG_LEVEL}
      - REFERENCE_APP_ENABLE_PREPROCESSING=${REFERENCE_APP_ENABLE_PREPROCESSING}
      - S2S_SERVICE=${S2S_SERVICE}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - CAMB_API_KEY=${CAMB_API_KEY:-}

    restart: always
    ports:
      - 3000:3000
    networks:
      - content-localization-network
    volumes:
      - ./volumes/demo-app:/demo-app:rw
      - ./assets:/demo-app-assets:ro
    depends_on:
      controller:
        condition: service_healthy
        required: true
      speech-to-speech:
        condition: service_healthy
        required: true
    profiles:
      - default
      - demo-app-third-party-s2s

networks:
  content-localization-network:
    driver: bridge
