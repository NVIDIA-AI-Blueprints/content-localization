[project]
name = "content-localization"
version = "1.1.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    # gRPC
    "grpcio==1.67.1",
    "grpcio-tools==1.67.1",
    "grpcio-health-checking==1.67.1",
    "protobuf==5.29.6",

    # ASR+TTS
    "elevenlabs==2.42.0",
    "audioread==3.1.0",
    "pydub==0.25.1",

    # others
    "packaging==26.0",
    "requests==2.33.1",
    "typing_extensions==4.15.0",
    "python-dotenv==1.2.2",
    "ngcsdk==4.16.0",

    # transitive dep pins at or above the versions that remediate NSpect and
    # pip-audit CVEs
    "urllib3==2.7.0",
    "cryptography==49.0.0",
    "pillow==12.3.0",
    "fonttools==4.62.1",
    "pygments==2.20.0",
    "tornado==6.5.7",
    "aiohttp==3.14.1",
    "idna==3.18",
]
[project.optional-dependencies]
gpu = [
    # "onnxruntime-gpu",
    "pycuda", 
    # "cupy-cuda12x",
    "tensorrt-cu12>=10.9,<10.10",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "recommonmark",
    "sphinxcontrib.mermaid",
]
triton = [
    # 0.49.x carries PYSEC-2026-161/248/249 and CVE-2026-48817/48818; 1.3.1 is
    # the first release with all fixes.
    "starlette==1.3.1"
]
# --- uv dependencies

# see uv settings: https://docs.astral.sh/uv/reference/settings/
[tool.uv]
managed = true # This is required for the project to be managed by uv.
# yarl 1.24.0 and 1.24.1 were published with cp310 wheels only — no cp312
# wheels exist, so installs fail on Python 3.12 images. Exclude both releases.
constraint-dependencies = ["yarl!=1.24.0,!=1.24.1"]

# uv honors netrc and keyrings for credentials
# put this in your ~/.netrc

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# --- tests

[tool.pytest.ini_options]
# Test discovery and execution
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test execution options
addopts = """
    --verbose
    --strict-markers
    --durations=0
    --cov=src
    --cov=client
    --cov-report=term
    --cov-report=term-missing
    --cov-report=html:build/coverage
    --cov-report=xml:build/coverage/coverage.xml
    --no-cov-on-fail
"""

# Python path configuration - include source roots
pythonpath = [
    ".",
    "./src",
    "./client",
    "./protos/generated",
]

# Test markers
markers = [
    "unit: marks unit test, i.e. testing a single, well isolated functionality (deselect with '-m \"not unit\"')",
    "integration: marks test checking the elements when integrated into subsystems (deselect with '-m \"not integration\"')",
    "system: marks test working at the highest integration level (deselect with '-m \"not system\"')",
    "acceptance: marks test checking whether the developed product/model passes the user defined acceptance criteria (deselect with '-m \"not acceptance\"')",
    "docs: mark tests related to documentation (deselect with '-m \"not docs\"')",
    "skipduringci: marks tests that are skipped ci as they are addressed by Jenkins jobs but should be run to test user setups",
    "pleasefixme: marks tests that are broken and need fixing",
]

# Directories to ignore when discovering tests
norecursedirs = [
    "external",
    "examples",
    "docs",
    "scripts",
    "tools",
    "tutorials",
    "build",
    "dist",
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    "*.egg-info",
    "volumes",
    "protos/generated",
]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
extend-exclude = [
    "build",
    "dist",
    "volumes",
    "protos/generated",
    "src/common/base_utils/ai4m_base_utils",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.pyw",
    "*.pyz",
]
select = [
    # Core Flake8 rules (pycodestyle/pyflakes)
    "E",
    "F",
    "W",
    # Imports
    "I",
    # Quality/safety improvements
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "A",   # flake8-builtins
    "N",   # pep8-naming
    "ARG", # flake8-unused-arguments
    "S",   # flake8-bandit
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PL",  # pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "E203",
    "E402",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Pytest test functions assert outcomes with bare `assert` statements by
# design, so bandit's assert warning (S101) does not apply to this suite.
"functional_tests/*" = ["S101"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
preview = false

[tool.mypy]
disable_error_code = ["call-arg"]

[tool.pyright]
extraPaths = [
    "src",
    "client",
    "protos/generated",
]
executionEnvironments = [
    { root = ".", extraPaths = ["src", "client", "protos/generated"] },
]

[tool.coverage.run]
source = ["src", "client"]
omit = [
    "tests/*",
    "setup.py",
    "*/__init__.py",
    "protos/generated/*",
    "protos/generated/**/*",
]
data_file = "build/.coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "pass",
    "raise ImportError",
]
show_missing = true
# fail_under = 80

[tool.coverage.html]
directory = "build/coverage"
title = "Content Localization Coverage Report"

# --- poetry for s2s & asd services
# TODO: remove poetry from containers and use uv instead

[tool.poetry]
name = "content-localization"
version = "1.1.0"
description = "Content Localization Service"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
grpcio = "1.67.1"
grpcio-tools = "1.67.1"
grpcio-health-checking = "1.67.1"
# Compatible-release pin matching the generated proto stubs and the working
# venv; a floating "*" here let container builds drift to protobuf 6.x.
protobuf = "5.29.6"
elevenlabs = ">=2.32.0"
audioread = ">=3.0.1"
pydub = ">=0.25.1"
packaging = "*"
requests = ">=2.31.0"
typing_extensions = "*"
python-dotenv = "*"
ngcsdk = ">=4.8"
urllib3 = ">=2.7.0"
cryptography = ">=48.0.1"
pillow = ">=12.3.0"
fonttools = ">=4.62.1"
pygments = ">=2.20.0"
tornado = ">=6.5.7"
aiohttp = ">=3.14.1"
idna = ">=3.15"
setuptools = ">=78.1.1"
# yarl 1.24.0 and 1.24.1 were published with cp310 wheels only — no cp312
# wheels exist, so poetry install fails on the python:3.12 base image. Pin to
# 1.24.2, the latest release with full cp312 manylinux/musllinux coverage.
yarl = "1.24.2"

[tool.poetry.group.gpu.dependencies]
pycuda = "*"
tensorrt-cu12 = ">=10.9,<10.10"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-cov = ">=4.1.0"
pytest-asyncio = ">=1.1.0"
pytest-mock = ">=3.12.0"
pytest-html = ">=3.2.0"
psutil = "*"

[tool.poetry.group.lint.dependencies]
pre-commit = ">=4.2.0"
ruff = "*"
mypy = "*"

[dependency-groups]
# matplotlib powers client-side latency plotting (client/s2s/latency_analysis)
# and numpy backs the test fixtures; neither is imported by the services, so
# they live in the dev group and stay out of the service container images
# (built with `poetry install --without dev`). uv installs this group into the
# local .venv by default, so the clients and test suite keep working.
dev = [
    "matplotlib==3.10.8",
    "mypy==1.20.0",
    "numpy==1.26.4",
    "pre-commit==4.5.1",
    "psutil==7.2.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.9",
]
